# 一键部署：后端（uvicorn）+ 前端（nginx 托管静态 + 反代 /api）+ PostgreSQL/pgvector（生产向量库）
# 使用：在 srm-maxkb/ 目录执行 `docker compose -f deploy/docker-compose.yml up -d --build`
# 知识库首次需构建：进入后端容器执行 `python -m knowledge.build_kb`
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=srm
      - POSTGRES_PASSWORD=srm_pass
      - POSTGRES_DB=srm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d srm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com
      - DEEPSEEK_MODEL=deepseek-chat
      - JWT_SECRET=${JWT_SECRET:-}
      - API_KEYS=${API_KEYS:-srm_dev_demo_key}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - IFRAME_ALLOWED_ORIGINS=${IFRAME_ALLOWED_ORIGINS:-*}
      - RATE_LIMIT_PER_MIN=60
      - DOCX_PATH=/data/blueprint.docx
      # 生产检索链路：稠密向量（BGE） + BM25 混合检索 → bge-reranker-v2-m3 精排 → pgvector 存储
      - EMBEDDING_PROVIDER=bge
      - BGE_MODEL_PATH=BAAI/bge-small-zh-v1.5
      - HF_ENDPOINT=https://hf-mirror.com
      - RERANKER_PROVIDER=bge
      - VECTORSTORE_PROVIDER=pgvector
      - PGVECTOR_DSN=postgresql://srm:srm_pass@db:5432/srm
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 业务蓝图 docx（请将实际文件放到 ./deploy/blueprint.docx 或修改路径）
      - ./blueprint.docx:/data/blueprint.docx:ro
      # SQLite（反馈/审计等轻量数据）
      - kb_data:/app/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  kb_data:
